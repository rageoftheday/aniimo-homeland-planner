name: Refresh TH.GL global item catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '47 7 * * 1'
permissions:
  contents: write
jobs:
  thgl-items:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect and validate item IDs and names
        run: node tools/scrape-thgl-items.js
      - name: Commit catalog only after validation
        run: |
          if git diff --quiet -- data/thgl-items.js; then
            echo "No changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/thgl-items.js
          git commit -m "data: refresh TH.GL verified item IDs"
          git push
