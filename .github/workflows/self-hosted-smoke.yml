name: Self-hosted runner smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'work/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Runner identity
        run: |
          set -euxo pipefail
          whoami
          hostname
          id
          pwd

      - name: Verify toolchain
        run: |
          set -euxo pipefail
          git --version
          node --version
          npm --version
          python3 --version

      - name: Verify NVMe workspace
        run: |
          set -uxo pipefail
          echo "=== identity ==="
          whoami
          id
          echo "=== path inspection ==="
          ls -ld /mnt || true
          ls -ld /mnt/nvme1 || true
          ls -ld /mnt/nvme1/aniimo-planner-cache || true
          namei -l /mnt/nvme1/aniimo-planner-cache || true
          echo "=== mounts ==="
          mount | grep -E ' /mnt/nvme1( |/)' || true
          df -h /mnt /mnt/nvme1 2>&1 || true
          echo "=== existence/write checks ==="
          if [ ! -d /mnt/nvme1/aniimo-planner-cache ]; then
            echo "::error::Runner cannot see /mnt/nvme1/aniimo-planner-cache"
            exit 21
          fi
          if [ ! -w /mnt/nvme1/aniimo-planner-cache ]; then
            echo "::error::Runner can see the cache directory but cannot write to it"
            exit 22
          fi
          touch /mnt/nvme1/aniimo-planner-cache/.runner-smoke
          rm /mnt/nvme1/aniimo-planner-cache/.runner-smoke
          echo "NVMe workspace OK"

      - name: Checkout planner
        uses: actions/checkout@v4

      - name: Validate static site
        run: |
          set -euxo pipefail
          test -s index.html
          test -s css/app.css
          test -s js/app.js
          test -s js/dom.js
          test -s js/importer.js
          test -s js/views.js
          test -s js/home-snapshot.js
          test -s data/embedded-aniidex-catalog.js
          test -s data/egg-reference.js
          test -s data/food-energy-reference.js
          test -s data/questlog-items.js
          test -s data/homeland-reference-data.js
          test -s js/homeland-data.js
          test -s data/asset-manifest.js
          test -s data/aniimo-stage-images.csv
          test -s data/aniimo-stage-index.js
          test -s js/assets.js
          test -s tools/scrape-questlog-items.js
          grep -q '<!doctype html>' index.html
          grep -q '<title>Aniimo Homeland Planner</title>' index.html
          test -s assets/favicon.svg
          grep -q 'rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=1"' index.html
          grep -q '<h1>Aniimo Homeland Planner</h1>' index.html
          ! grep -q '<title>Aniimo Homeland Planner v' index.html
          ! grep -q '<h1>Aniimo Homeland Planner v' index.html
          grep -q 'css/app.css?v=30.23.1' index.html
          grep -q 'js/views.js?v=30.23.1' index.html
          grep -q 'js/home-snapshot.js?v=3' index.html
          grep -q 'js/importer.js?v=30.15.4' index.html
          grep -q 'data/aniimo-stage-index.js?v=30.13.3' index.html
          grep -q 'data/homeland-reference-data.js' index.html
          grep -q 'js/homeland-data.js' index.html
          grep -q 'data/asset-manifest.js' index.html
          grep -q 'data/aniimo-species.js' index.html
          grep -q 'data/aniimo-stage-index.js' index.html
          grep -q 'data/aniimo-species.js' index.html
          grep -q 'js/assets.js' index.html
          grep -q 'data/embedded-aniidex-catalog.js' index.html
          grep -q 'data/egg-reference.js?v=1' index.html
          grep -q 'data/food-energy-reference.js?v=1' index.html
          grep -q 'data/questlog-items.js?v=1' index.html
          grep -q 'data/official-wiki-homeland.js?v=30.16.0' index.html
          grep -q 'js/wiki-homeland.js?v=30.16.0' index.html
          test -s data/official-wiki-homeland.json
          test -s data/official-wiki-homeland.js
          node --check js/wiki-homeland.js
          node - <<'NODE'
          global.window=global;
          require('./data/official-wiki-homeland.js');
          require('./js/wiki-homeland.js');
          const hauling=global.WikiHomeland.rankAbility('Hauling',4);
          const glacy=hauling.find(x=>x.name==='Glacy');
          if(!glacy||glacy.level!==4||!glacy.forms.some(f=>f.slug==='prismana-form')) throw new Error('Smart Hauling ranking failed for Glacy');
          const leisure=global.WikiHomeland.rankAbility('Leisure',4);
          const sherro=leisure.find(x=>x.name==='Sherro');
          if(!sherro||sherro.level!==4) throw new Error('Smart Leisure ranking failed for Sherro');
          console.log('Official Wiki smart ranking helpers OK');
          NODE
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/official-wiki-homeland.json','utf8'));
          if(d.counts.species!==86) throw new Error('Unexpected Wiki species count '+d.counts.species);
          if(d.counts.forms!==206) throw new Error('Unexpected Wiki form count '+d.counts.forms);
          if(d.counts.formsWithAbilities!==206) throw new Error('Missing Wiki form abilities');
