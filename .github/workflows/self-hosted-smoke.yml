name: Self-hosted runner smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'work/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Runner identity
        run: |
          set -euxo pipefail
          whoami
          hostname
          id
          pwd

      - name: Verify toolchain
        run: |
          set -euxo pipefail
          git --version
          node --version
          npm --version
          python3 --version

      - name: Verify NVMe workspace
        run: |
          set -uxo pipefail
          echo "=== identity ==="
          whoami
          id
          echo "=== path inspection ==="
          ls -ld /mnt || true
          ls -ld /mnt/nvme1 || true
          ls -ld /mnt/nvme1/aniimo-planner-cache || true
          namei -l /mnt/nvme1/aniimo-planner-cache || true
          echo "=== mounts ==="
          mount | grep -E ' /mnt/nvme1( |/)' || true
          df -h /mnt /mnt/nvme1 2>&1 || true
          echo "=== existence/write checks ==="
          if [ ! -d /mnt/nvme1/aniimo-planner-cache ]; then
            echo "::error::Runner cannot see /mnt/nvme1/aniimo-planner-cache"
            exit 21
          fi
          if [ ! -w /mnt/nvme1/aniimo-planner-cache ]; then
            echo "::error::Runner can see the cache directory but cannot write to it"
            exit 22
          fi
          touch /mnt/nvme1/aniimo-planner-cache/.runner-smoke
          rm /mnt/nvme1/aniimo-planner-cache/.runner-smoke
          echo "NVMe workspace OK"

      - name: Checkout planner
        uses: actions/checkout@v4

      - name: Validate static site
        run: |
          set -euxo pipefail
          test -s index.html
          test -s css/app.css
          test -s js/app.js
          test -s js/dom.js
          test -s js/importer.js
          test -s js/views.js
          test -s data/embedded-aniidex-catalog.js
          test -s data/homeland-reference-data.js
          test -s js/homeland-data.js
          test -s data/asset-manifest.js
          test -s data/aniimo-stage-images.csv
          test -s data/aniimo-stage-index.js
          test -s js/assets.js
          grep -q '<!doctype html>' index.html
          grep -q '<title>Aniimo Homeland Planner</title>' index.html
          grep -q '<h1>Aniimo Homeland Planner</h1>' index.html
          ! grep -q '<title>Aniimo Homeland Planner v' index.html
          ! grep -q '<h1>Aniimo Homeland Planner v' index.html
          grep -q 'css/app.css?v=30.17.0' index.html
          grep -q 'js/views.js?v=30.18.0' index.html
          grep -q 'js/importer.js?v=30.15.0' index.html
          grep -q 'data/aniimo-stage-index.js?v=30.13.3' index.html
          grep -q 'data/homeland-reference-data.js' index.html
          grep -q 'js/homeland-data.js' index.html
          grep -q 'data/asset-manifest.js' index.html
          grep -q 'data/aniimo-species.js' index.html
          grep -q 'data/aniimo-stage-index.js' index.html
          grep -q 'data/aniimo-species.js' index.html
          grep -q 'js/assets.js' index.html
          grep -q 'data/embedded-aniidex-catalog.js' index.html
          grep -q 'data/official-wiki-homeland.js?v=30.16.0' index.html
          grep -q 'js/wiki-homeland.js?v=30.16.0' index.html
          test -s data/official-wiki-homeland.json
          test -s data/official-wiki-homeland.js
          node --check js/wiki-homeland.js
          node - <<'NODE'
          global.window=global;
          require('./data/official-wiki-homeland.js');
          require('./js/wiki-homeland.js');
          const hauling=global.WikiHomeland.rankAbility('Hauling',4);
          const glacy=hauling.find(x=>x.name==='Glacy');
          if(!glacy||glacy.level!==4||!glacy.forms.some(f=>f.slug==='prismana-form')) throw new Error('Smart Hauling ranking failed for Glacy');
          const leisure=global.WikiHomeland.rankAbility('Leisure',4);
          const sherro=leisure.find(x=>x.name==='Sherro');
          if(!sherro||sherro.level!==4) throw new Error('Smart Leisure ranking failed for Sherro');
          console.log('Official Wiki smart ranking helpers OK');
          NODE
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/official-wiki-homeland.json','utf8'));
          if(d.counts.species!==86) throw new Error('Unexpected Wiki species count '+d.counts.species);
          if(d.counts.forms!==206) throw new Error('Unexpected Wiki form count '+d.counts.forms);
          if(d.counts.formsWithAbilities!==206) throw new Error('Missing Wiki form abilities');
          if(d.counts.unknownAbilityIds!==0||d.counts.abilitiesMissingLevel!==0) throw new Error('Wiki ability parse incomplete');
          const g=d.species.find(s=>s.name==='Glacy');
          const p=g&&g.forms.find(f=>f.slug==='prismana-form');
          const sig=(p?.homelandAbilities||[]).map(a=>a.type+':'+a.level).sort().join(',');
          if(sig!=='Hauling:4,Light:3,Water:4') throw new Error('Glacy Wiki sentinel mismatch '+sig);
          console.log('Official Wiki Homeland reference OK');
          NODE
          grep -q 'js/importer.js' index.html
          grep -q 'js/views.js' index.html
          grep -q 'js/dom.js' index.html
          grep -q 'js/app.js?v=30.18.0' index.html
          grep -q 'data-tab="aniimos"' index.html
          grep -q 'id="aniimosPane"' index.html
          grep -q 'Backup ▾' index.html
          grep -q 'Save Backup File' index.html
          grep -q 'Legacy Local Recovery' index.html
          ! grep -q 'Tabbed Homeland workspace' index.html
          ! grep -q 'id="saveBtn"' index.html
          ! grep -q 'id="exportBtn"' index.html
          ! grep -q 'id="importBtn"' index.html
          grep -q 'data-tab="dashboard" class="active">Dashboard</button><button data-tab="map">Homeland Maker</button><button data-tab="progression">Progression</button><button data-tab="advisor">Advisor</button><button data-tab="roster">Imported Roster</button><button data-tab="suggestions">Suggestions</button><button data-tab="aniimos">Aniimos</button><button data-tab="production">Recipes</button><button data-tab="database">Database</button>' index.html
          ! grep -q 'data-tab="import"' index.html
          ! grep -q 'id="importPane"' index.html
          grep -q 'Imported Roster / Job Advisor' index.html
          grep -q 'id="advisorRankMatrix"' index.html
          grep -q 'productionBrowserHead' js/views.js
          grep -q 'Homeland Ability Rankings' js/views.js
          grep -q 'Official Wiki Aniimo' js/views.js
          grep -q 'Family-gated stations' js/views.js
          grep -q 'Family Requirements by Station & Recipe' js/views.js
          ! grep -q 'Family-locked recipes' js/views.js
          grep -q 'Aniimo Collection' js/views.js
          grep -q 'Aniimo Details' js/views.js
          grep -q 'Missing Prismana' js/views.js
          grep -q 'My Caught Forms' js/views.js
          grep -q 'caught_pet_ids' js/views.js
          grep -q 'localFormForWiki' js/views.js
          grep -q 'window.WikiHomeland?.rankAbility' js/views.js
          grep -q 'aniimosSubnav' css/app.css
          grep -q 'aniimoAbilityRankGrid' css/app.css
          grep -q 'collectionBadge' css/app.css
          grep -q 'aniimoDetailForms' css/app.css
          grep -q "let activeMainTab='dashboard'" js/views.js
          grep -q 'function abilityContributors' js/views.js
          grep -q 'Home Ability Distribution' js/views.js
          grep -q 'dashboardImport' js/views.js
          grep -q 'Aniimo</th><th>Total levels</th><th>Current job demand' js/views.js
          node --check js/views.js
          grep -q 'productionRecipeTable' css/app.css
          grep -q 'dashboardImportHost' css/app.css
          grep -q 'abilityContributorGrid' css/app.css
          grep -q 'function aniidexBookmarkletCode' js/importer.js
          grep -q "setMainTab('dashboard')" js/importer.js
          grep -q "function renderImportTab(targetId='dashboardImport'" js/importer.js
          grep -q 'Dashboard Import / Sync section' js/importer.js
          grep -q 'Download Companion Extension' js/importer.js
          grep -q 'extension/download.html' js/importer.js
          grep -q 'downloads <b>only the extension</b>' js/importer.js
          test -s extension/download.html
          grep -q 'Aniimo_Homeland_Companion.zip' extension/download.html
          grep -q 'manifest.json' extension/download.html
          ! grep -q 'Direct UID Test' js/importer.js
          ! grep -q 'function importAniidexUid' js/importer.js
          ! grep -q 'Advanced: Paste Network Responses' js/importer.js
          ! grep -q 'importAniidexPastedResponses' js/importer.js
          grep -q '2. Bookmarklet Fallback' js/importer.js
          grep -q '3. Load Sync File' js/importer.js
          grep -q 'placeholder="Enter Aniimo UID"' js/importer.js
          ! grep -R -F '302000117964' index.html js extension README.md
          grep -q 'const EMBEDDED_ANIIDEX_CATALOG=' data/embedded-aniidex-catalog.js
          node --check js/dom.js
          grep -q 'function catalogPortraitHTML' js/app.js
          grep -q 'function wikiCatalogEntries' js/app.js
          grep -q "source:'official-wiki'" js/app.js
          grep -q "releasedByDex.get(String(sp.dex))" js/app.js
          grep -q 'Official Wiki forms and Homeland abilities are loaded first' index.html
          grep -q 'function appearancePreviewChoices' js/app.js
          grep -q 'data-appearance-choice' js/app.js
          grep -q 'appearancePreviewStrip' css/app.css
          grep -q 'workerPortrait img{width:100%;height:100%;object-fit:contain' css/app.css
          grep -q 'appearancePreview img{width:45px;height:45px;object-fit:contain' css/app.css
          grep -q 'catalogPortraitHTML(c)' js/app.js
          grep -q 'function openWorkerLargePreview' js/app.js
          grep -q 'data-worker-preview' js/app.js
          grep -q 'workerLargePreview aniimoModal open' js/app.js
          node --check js/app.js
          grep -q 'function renderAdvisorRankMatrix' js/app.js
          grep -q "Rank 5" js/app.js
          grep -q 'prismanaOnly' js/app.js
          node - <<'NODE'
          global.window=global;
          require('./data/aniimo-species.js');
          const src=require('fs').readFileSync('./js/app.js','utf8');
          if(!src.includes("window.ANIIMO_SPECIES_DATA?.species")) throw new Error('Full species roster is not feeding catalog');
          if(src.includes("rows.slice(0,120)")) throw new Error('Aniimo catalog is still truncated to 120 rows');
          if(!(global.ANIIMO_SPECIES_DATA?.species||[]).some(x=>x.name==='Somniwing')) throw new Error('Somniwing missing from species data');
          console.log('Somniwing catalog entry OK');
          NODE
          node --check js/importer.js
          grep -q 'function aniidexFormFactById' js/importer.js
          grep -q 'function aniidexSparklingAppearance' js/importer.js
          grep -q "w.formId=String(decoded.variant" js/importer.js
          grep -q "appearance:'Sparkling'" js/importer.js
          grep -q 'function aniidexFormIndexes' js/importer.js
          grep -q 'function decodeAniidexFormPreferred' js/importer.js
          grep -q 'function aniidexBundleCatalog' js/importer.js
          grep -q "/api/homeland/planner" extension/aniidex-main.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const embeddedSrc=fs.readFileSync('data/embedded-aniidex-catalog.js','utf8');
          const importerSrc=fs.readFileSync('js/importer.js','utf8').split('function aniimoZipCrc32')[0];
          const ctx={console,WeakMap,Map,window:{},defaultWorker:()=>({abilities:[]}),catalogEntries:()=>[]};
          vm.createContext(ctx);
          vm.runInContext(embeddedSrc+'\n'+importerSrc,ctx);
          const livePlanner={
            facts:{
              forms:{'live-key':{pet:9900000,variant:9900000,skills:{Fire:4}}},
              abilities:{Fire:{id:1000}}
            },
            text:{forms:{'9900000':{name:'Live Test Aniimo',form:'Current Form'}},abilities:{'1000':'Fire'}}
          };
          const live=vm.runInContext("decodeAniidexFormPreferred(9900000,__live)",Object.assign(ctx,{__live:livePlanner}));
          if(live?.name!=='Live Test Aniimo'||live?.catalogSource!=='aniidex-live') throw new Error('Live planner decoder priority failed');
          const fallback=vm.runInContext("decodeAniidexFormPreferred(1004300,null)",ctx);
          if(fallback?.name!=='Glacy'||fallback?.catalogSource!=='aniidex-embedded') throw new Error('Embedded fallback without planner failed');
          const known=[1004300,1019400,1028300,1035100,1043300,1004500,1021200,1032300];
          for(const id of known){
            const got=vm.runInContext("decodeAniidexFormPreferred("+id+",null)",ctx);
            if(!got||/^Form /.test(got.name)) throw new Error('Known form unresolved: '+id);
          }
          console.log('Aniidx live decoder and embedded fallback OK');
          NODE
          test -s extension/manifest.json
          test -s extension/background.js
          test -s extension/planner-bridge.js
          test -s extension/aniidex-isolated.js
          test -s extension/aniidex-main.js
          node --check extension/background.js
          node --check extension/planner-bridge.js
          node --check extension/aniidex-isolated.js
          node --check extension/aniidex-main.js
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')); console.log('Companion manifest OK')"
          grep -q '"version": "0.1.1"' extension/manifest.json
          grep -q 'async function sendToAniidex' extension/background.js
          grep -q 'chrome.tabs.reload(tab.id)' extension/background.js
          node --check js/views.js
          ! grep -q 'Not fully loaded yet' js/views.js
          ! grep -q 'Next-RV resource requirements' js/views.js
          node - <<'NODE'
          global.window=global;
          require('./data/aniimo-stage-index.js');
          const idx=global.ANIIMO_STAGE_INDEX||{};
          if(!idx.Somniwing?.['1023300']?.includes('Normal')) throw new Error('Somniwing stage image missing');
          if(Object.keys(idx.Irisalis||{}).length<5) throw new Error('Irisalis special image forms missing');
          if(!idx.Iris?.['1021100']?.includes('Umbral')) throw new Error('Expected Umbral availability missing');
          if(idx.Reefish) throw new Error('Reefish should not have local stage images');
          if(!idx.Gachapus?.['1062300']?.includes('Normal')) throw new Error('Gachapus image-backed unreleased entry missing');
          console.log('Stage image index OK',Object.keys(idx).length);
          NODE
          node --check data/embedded-aniidex-catalog.js
          node --check data/homeland-reference-data.js
          node --check js/homeland-data.js
          node --check data/asset-manifest.js
          node --check data/aniimo-species.js
          node --check data/aniimo-stage-index.js
          node --check js/assets.js
          test "$(find assets/aniimo/stage -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 3007
          test -s assets/aniimo/stage/Emberpup__1005100__ThreeQuarter__Normal.webp
          test -s assets/aniimo/stage/Emberpup__1005100__ThreeQuarter__Umbral.webp
          node - <<'NODE'
          global.window=global;
          require('./data/asset-manifest.js');
          require('./js/assets.js');
          const prism=Object.entries(global.ANIIMO_ASSET_MANIFEST.aniimoForms||{}).find(([,x])=>/prismana/i.test(x.form||''));
          if(!prism) throw new Error('Expected at least one Prismana form');
          const [id,f]=prism;
          const c=global.AniimoAssets.portraitCandidates(f.name,f.form,'Sparkling','Variant VI');
          if(!c[0].endsWith('__ThreeQuarter__Sparkling-06.webp')) throw new Error('Stage Sparkling Prismana VI path missing: '+c[0]);
          if(!global.AniimoAssets.portraitCandidates(f.name,f.form,'Umbral','')[0].includes('__ThreeQuarter__Umbral.webp')) throw new Error('Stage Umbral path missing');
          if(!global.AniimoAssets.portraitCandidates('Emberpup','Basic Form','Sparkling','Variant VI')[0].endsWith('Emberpup__1005100__ThreeQuarter__Sparkling-06.webp')) throw new Error('Stage Sparkling VI path missing');
          if(global.AniimoAssets.stageAppearanceLabel('Dazzling Sparkling','')!=='Sparkling-11') throw new Error('Dazzling mapping missing');
          if(global.AniimoAssets.stageAppearanceLabel('Shadow Sparkling','')!=='Sparkling-12') throw new Error('Shadow mapping missing');
          if(global.AniimoAssets.form('Stellarys','Prismana Form')?.id!=='1001202') throw new Error('Prismana Form alias did not resolve');
          console.log('Prismana alias resolution OK');
          console.log('Appearance asset model OK',id,c[0]);
          NODE
          grep -q 'function renderAniimosTab' js/views.js
          grep -q 'aniimoFormSelect' js/views.js
          grep -q 'aniimoAppearanceSelect' js/views.js
          grep -q 'aniimosImageFit' js/views.js
          grep -q 'aniimosImageSize' js/views.js
          grep -q 'Image fit' js/views.js
          grep -q 'aniimoPreviewModal' js/views.js
          grep -q 'data-preview-open' js/views.js
          grep -q 'aniimoModalAppearance' js/views.js
          grep -q 'aniimoModalForm' js/views.js
          grep -q 'aniimoModalNav' css/app.css
          grep -q "hiddenImageOnly=new Set(\['Jabster','Morphling','Fennelun','Soleon'\])" js/views.js
          grep -q 'Ability Form — Fennelun' js/views.js
          grep -q 'Ability Form — Soleon' js/views.js
          grep -q "noVariantSpecies=new Set(\['Lunara','Helion'\])" js/views.js
          grep -q 'Appearance' js/views.js
          grep -q "forms.length>1" js/views.js
          grep -q "unavailableDex=new Set" js/views.js
          grep -q 'aniimosGrid' css/app.css
          grep -q 'databaseBrowserHead' js/views.js
          grep -q 'databaseScroll' css/app.css
          grep -q 'databaseAniimoFixed' css/app.css
          grep -q 'databaseHeaderTable' js/views.js
          grep -q 'databaseBodyScroll' js/views.js
          grep -q 'databaseFamilySection' js/views.js
          grep -q 'databaseFamilyBodyScroll' js/views.js
          grep -q '#databasePane{overflow:auto' css/app.css
          grep -q 'databaseBodyScroll{height:clamp' css/app.css
          node - <<'NODE'
          global.window=global;
          require('./data/homeland-reference-data.js');
          require('./js/homeland-data.js');
          const v=global.HomelandData.validate();
          if(!v.ok) throw new Error(v.issues.join('; '));
          if(v.counts.facilities!==29 || v.counts.recipes!==217 || v.counts.items!==233 || v.counts.rv!==20 || v.counts.plots!==16) {
            throw new Error('Unexpected Homeland reference counts: '+JSON.stringify(v.counts));
          }
          const checks={
            'Crackle Generator':{rv:12,w:2,h:2},
            'Crackle Power Pole':{rv:12,w:1.5,h:1.5},
            'Starfall Hammock':{rv:12,w:5,h:5},
            'Floral Windmill':{rv:18,w:5,h:5},
            'Phonolfactory Table':{rv:6,w:3.5,h:3.5},
            'Pickling Jar':{rv:8,w:2.5,h:2},
            'Blazing Stove':{rv:8,w:2.5,h:1.75}
          };
          for (const [name,want] of Object.entries(checks)) {
            const f=global.HomelandData.getFacility(name);
            const got={rv:Math.min(...(f.levels||[{rv:f.rv||1}]).map(x=>Number(x.rv)||99)),w:Number(f.footprint[0]),h:Number(f.footprint[1])};
            if(JSON.stringify(got)!==JSON.stringify(want)) throw new Error(name+' mismatch '+JSON.stringify(got));
          }
          console.log('Homeland reference validation OK',v.counts);
          NODE
          printf 'index.html bytes: '
          wc -c < index.html
          printf 'app.js bytes: '
          wc -c < js/app.js
          printf 'catalog bytes: '
          wc -c < data/embedded-aniidex-catalog.js
