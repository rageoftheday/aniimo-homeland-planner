name: Self-hosted runner smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'work/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Runner identity
        run: |
          set -euxo pipefail
          whoami
          hostname
          id
          pwd

      - name: Verify toolchain
        run: |
          set -euxo pipefail
          git --version
          node --version
          npm --version
          python3 --version

      - name: Verify NVMe workspace
        run: |
          set -uxo pipefail
          echo "=== identity ==="
          whoami
          id
          echo "=== path inspection ==="
          ls -ld /mnt || true
          ls -ld /mnt/nvme1 || true
          ls -ld /mnt/nvme1/aniimo-planner-cache || true
          namei -l /mnt/nvme1/aniimo-planner-cache || true
          echo "=== mounts ==="
          mount | grep -E ' /mnt/nvme1( |/)' || true
          df -h /mnt /mnt/nvme1 2>&1 || true
          echo "=== existence/write checks ==="
          if [ ! -d /mnt/nvme1/aniimo-planner-cache ]; then
            echo "::error::Runner cannot see /mnt/nvme1/aniimo-planner-cache"
            exit 21
          fi
          if [ ! -w /mnt/nvme1/aniimo-planner-cache ]; then
            echo "::error::Runner can see the cache directory but cannot write to it"
            exit 22
          fi
          touch /mnt/nvme1/aniimo-planner-cache/.runner-smoke
          rm /mnt/nvme1/aniimo-planner-cache/.runner-smoke
          echo "NVMe workspace OK"

      - name: Checkout planner
        uses: actions/checkout@v4

      - name: Validate static site
        run: |
          set -euxo pipefail
          test -s index.html
          test -s css/app.css
          test -s js/app.js
          test -s js/dom.js
          test -s js/importer.js
          test -s js/views.js
          test -s data/embedded-aniidex-catalog.js
          test -s data/homeland-reference-data.js
          test -s js/homeland-data.js
          test -s data/asset-manifest.js
          test -s js/assets.js
          grep -q '<!doctype html>' index.html
          grep -q 'Aniimo Homeland Offline Planner v30.11.1' index.html
          grep -q 'css/app.css' index.html
          grep -q 'data/homeland-reference-data.js' index.html
          grep -q 'js/homeland-data.js' index.html
          grep -q 'data/asset-manifest.js' index.html
          grep -q 'js/assets.js' index.html
          grep -q 'data/embedded-aniidex-catalog.js' index.html
          grep -q 'js/importer.js' index.html
          grep -q 'js/views.js' index.html
          grep -q 'js/dom.js' index.html
          grep -q 'js/app.js' index.html
          grep -q 'productionBrowserHead' js/views.js
          grep -q 'productionRecipeTable' css/app.css
          grep -q 'function aniidexBookmarkletCode' js/importer.js
          ! grep -q 'Direct UID Test' js/importer.js
          ! grep -q 'function importAniidexUid' js/importer.js
          grep -q 'const EMBEDDED_ANIIDEX_CATALOG=' data/embedded-aniidex-catalog.js
          node --check js/dom.js
          node --check js/app.js
          node --check js/importer.js
          node --check js/views.js
          node --check data/embedded-aniidex-catalog.js
          node --check data/homeland-reference-data.js
          node --check js/homeland-data.js
          node --check data/asset-manifest.js
          node --check js/assets.js
          grep -q 'databaseBrowserHead' js/views.js
          grep -q 'databaseScroll' css/app.css
          grep -q 'databaseAniimoFixed' css/app.css
          grep -q 'databaseHeaderTable' js/views.js
          grep -q 'databaseBodyScroll' js/views.js
          node - <<'NODE'
          global.window=global;
          require('./data/homeland-reference-data.js');
          require('./js/homeland-data.js');
          const v=global.HomelandData.validate();
          if(!v.ok) throw new Error(v.issues.join('; '));
          if(v.counts.facilities!==29 || v.counts.recipes!==217 || v.counts.items!==233 || v.counts.rv!==20 || v.counts.plots!==16) {
            throw new Error('Unexpected Homeland reference counts: '+JSON.stringify(v.counts));
          }
          const checks={
            'Crackle Generator':{rv:12,w:2,h:2},
            'Crackle Power Pole':{rv:12,w:1.5,h:1.5},
            'Starfall Hammock':{rv:12,w:5,h:5},
            'Floral Windmill':{rv:18,w:5,h:5},
            'Phonolfactory Table':{rv:6,w:3.5,h:3.5},
            'Pickling Jar':{rv:8,w:2.5,h:2},
            'Blazing Stove':{rv:8,w:2.5,h:1.75}
          };
          for (const [name,want] of Object.entries(checks)) {
            const f=global.HomelandData.getFacility(name);
            const got={rv:Math.min(...(f.levels||[{rv:f.rv||1}]).map(x=>Number(x.rv)||99)),w:Number(f.footprint[0]),h:Number(f.footprint[1])};
            if(JSON.stringify(got)!==JSON.stringify(want)) throw new Error(name+' mismatch '+JSON.stringify(got));
          }
          console.log('Homeland reference validation OK',v.counts);
          NODE
          printf 'index.html bytes: '
          wc -c < index.html
          printf 'app.js bytes: '
          wc -c < js/app.js
          printf 'catalog bytes: '
          wc -c < data/embedded-aniidex-catalog.js
