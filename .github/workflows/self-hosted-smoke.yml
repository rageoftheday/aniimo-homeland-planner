name: Self-hosted runner smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'work/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Runner identity
        run: |
          set -euxo pipefail
          whoami
          hostname
          id
          pwd

      - name: Verify toolchain
        run: |
          set -euxo pipefail
          git --version
          node --version
          npm --version
          python3 --version

      - name: Verify NVMe workspace
        run: |
          set -uxo pipefail
          echo "=== identity ==="
          whoami
          id
          echo "=== path inspection ==="
          ls -ld /mnt || true
          ls -ld /mnt/nvme1 || true
          ls -ld /mnt/nvme1/aniimo-planner-cache || true
          namei -l /mnt/nvme1/aniimo-planner-cache || true
          echo "=== mounts ==="
          mount | grep -E ' /mnt/nvme1( |/)' || true
          df -h /mnt /mnt/nvme1 2>&1 || true
          echo "=== existence/write checks ==="
          if [ ! -d /mnt/nvme1/aniimo-planner-cache ]; then
            echo "::error::Runner cannot see /mnt/nvme1/aniimo-planner-cache"
            exit 21
          fi
          if [ ! -w /mnt/nvme1/aniimo-planner-cache ]; then
            echo "::error::Runner can see the cache directory but cannot write to it"
            exit 22
          fi
          touch /mnt/nvme1/aniimo-planner-cache/.runner-smoke
          rm /mnt/nvme1/aniimo-planner-cache/.runner-smoke
          echo "NVMe workspace OK"

      - name: Checkout planner
        uses: actions/checkout@v4

      - name: Validate static site
        run: |
          set -euxo pipefail
          test -s index.html
          test -s css/app.css
          test -s js/app.js
          test -s js/dom.js
          test -s js/importer.js
          test -s js/views.js
          test -s data/embedded-aniidex-catalog.js
          grep -q '<!doctype html>' index.html
          grep -q 'Aniimo Homeland Offline Planner v30.9.4' index.html
          grep -q 'css/app.css' index.html
          grep -q 'data/embedded-aniidex-catalog.js' index.html
          grep -q 'js/importer.js' index.html
          grep -q 'js/views.js' index.html
          grep -q 'js/dom.js' index.html
          grep -q 'js/app.js' index.html
          grep -q 'function aniidexBookmarkletCode' js/importer.js
          ! grep -q 'Direct UID Test' js/importer.js
          ! grep -q 'function importAniidexUid' js/importer.js
          grep -q 'const EMBEDDED_ANIIDEX_CATALOG=' data/embedded-aniidex-catalog.js
          node --check js/dom.js
          node --check js/app.js
          node --check js/importer.js
          node --check js/views.js
          node --check data/embedded-aniidex-catalog.js
          printf 'index.html bytes: '
          wc -c < index.html
          printf 'app.js bytes: '
          wc -c < js/app.js
          printf 'catalog bytes: '
          wc -c < data/embedded-aniidex-catalog.js
