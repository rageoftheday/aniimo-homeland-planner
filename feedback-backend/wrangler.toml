name = "aniimo-planner-feedback"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "aniimo-feedback"
database_id = "REPLACE_WITH_ACTUAL_D1_DATABASE_ID"

[vars]
SITE_ORIGIN = "https://rageoftheday.github.io"
TURNSTILE_HOSTNAME = "rageoftheday.github.io"
ACCESS_TEAM_DOMAIN = "REPLACE_WITH_TEAM.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_WITH_ACCESS_APPLICATION_AUDIENCE"
ADMIN_EMAIL = "REPLACE_WITH_YOUR_EMAIL"
